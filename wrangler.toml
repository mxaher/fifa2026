#:schema node_modules/wrangler/config-schema.json
name = "fifa26-predictions"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────
# Cloudflare Workers + D1 configuration
# ──────────────────────────────────────────────────────────

# D1 Database binding — accessible as env.DB in Workers
[[d1_databases]]
binding = "DB"
database_name = "fifa26-predictions-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ──────────────────────────────────────────────────────────
# Non-secret environment variables
# ──────────────────────────────────────────────────────────
[vars]
NODE_ENV = "production"

# ── Cron Triggers ─────────────────────────────────────────────
# Runs every 5 minutes during tournament hours (UTC 12:00-23:59)
# and every 30 minutes outside match hours to save on invocations.
[triggers]
crons = [
  "*/5 12-23 * 6-7 *",
  "*/30 0-11 * 6-7 *",
  "0 * * 1-5,8-12 *"
]
